          })
          .map((o) => o.id);
        app.setSelection(s.add ? Array.from(new Set(app.sel.concat(hits))) : hits);
        app.requestOverlay();
      }
    },

    cancel() {
      if (this.s && this.s.T) {
        for (const o of this.app.selected()) if (this.s.T.has(o.id)) (o.transform = this.s.T.get(o.id)), this.app.touch(o);
      }
      this.s = null;
      this.app.setDraft(null);
      this.app.requestRender();
    },

    dblclick(ev) {
      const app = this.app;
      const top = app.canvas.idFromTarget(ev.target, false);
      if (!top) return;
      const o = app.get(top);
      if (o.type === 'group') {
        const deep = app.canvas.idFromTarget(ev.target, true);
        if (deep && deep !== top) app.setSelection([deep]);
        return;
      }
      if (o.type === 'text') {
        app.setTool('text');
        V3D.Tools.text.edit(o);
        return;
      }
      if (Doc.isShape(o)) app.setTool('node');
    },

    overlay() {
      const app = this.app;
      const s = this.s;
      let out = '';
      if (s && s.mode === 'band') {
        const [x1, y1] = app.canvas.toScreen(Math.min(s.x0, s.x1), Math.min(s.y0, s.y1));
        const [x2, y2] = app.canvas.toScreen(Math.max(s.x0, s.x1), Math.max(s.y0, s.y1));
        out += `<rect x="${x1}" y="${y1}" width="${x2 - x1}" height="${y2 - y1}" class="ov-band"/>`;
      }
      if (s && s.guides) out += Snap.guideMarkup(app, s.guides);
      const b = s && s.mode === 'move' && s.previewBox ? s.previewBox : app.selectionBBox();
      if (!b || !app.sel.length) return out;
      const c = app.canvas;
      const [x1, y1] = c.toScreen(b.x, b.y);
      const [x2, y2] = c.toScreen(b.x2, b.y2);
      out += `<rect x="${fmt(x1, 1)}" y="${fmt(y1, 1)}" width="${fmt(x2 - x1, 1)}" height="${fmt(y2 - y1, 1)}" class="ov-selbox"/>`;
      if (s && s.mode === 'move') return out;
      // Per-object outlines when several objects are selected.
      if (app.sel.length > 1)
        for (const o of app.selected()) {
          const ob = app.bboxOf(o);
          if (!ob) continue;
          const [a1, b1] = c.toScreen(ob.x, ob.y);
          const [a2, b2] = c.toScreen(ob.x2, ob.y2);
          out += `<rect x="${fmt(a1, 1)}" y="${fmt(b1, 1)}" width="${fmt(a2 - a1, 1)}" height="${fmt(b2 - b1, 1)}" class="ov-subbox"/>`;
        }
      const hs = this.handles(app);
      const rot = hs.find((h) => h.id === 'rot');
      out += `<line x1="${fmt(rot.x, 1)}" y1="${fmt(y1, 1)}" x2="${fmt(rot.x, 1)}" y2="${fmt(rot.y, 1)}" class="ov-stem"/>`;
      for (const h of hs) {
        if (h.id === 'rot') out += `<circle cx="${fmt(h.x, 1)}" cy="${fmt(h.y, 1)}" r="5.5" class="ov-rot"/>`;
        else out += `<rect x="${fmt(h.x - 4.5, 1)}" y="${fmt(h.y - 4.5, 1)}" width="9" height="9" rx="1.5" class="ov-handle"/>`;
      }
      return out;
    },
  };

  /* ======================= Node ======================= */
  const key = (si, ni) => si + ':' + ni;
  const parseKey = (k) => k.split(':').map(Number);

  Tools.node = {
    id: 'node',
    name: 'Edit nodes',
    shortcut: 'A',
    cursor: 'default',
    hint: 'Drag nodes and their handles to reshape. Double-click a segment to add a node. Delete removes selected nodes. Drag a segment to bend it.',
    sel: new Set(),
    s: null,

    activate() {
      this.sel = new Set();
      const t = this.target();
      if (t && t.type !== 'path' && t.type !== 'text' && !['rect', 'ellipse', 'star'].includes(t.type)) this.app.setSelection([]);
    },
    target() {
      const app = this.app;
      if (app.sel.length !== 1) return null;
      const o = app.get(app.sel[0]);
      return o && Doc.isShape(o) ? o : null;
    },
    W(o) {
      return M2.mul(this.app.parentMatrix(o.id), o.transform);
    },
    /** Screen positions of nodes/handles for a path object. */
    geo(o) {
      const W = this.W(o);
      const c = this.app.canvas;
      const scr = (x, y) => {
        const p = M2.apply(W, x, y);
        return c.toScreen(p[0], p[1]);
      };
      return { W, scr };
    },
    visibleHandles(o) {
      const out = [];
      if (o.type !== 'path') return out;
      o.subs.forEach((sp, si) => {
        const n = sp.nodes.length;
        sp.nodes.forEach((nd, ni) => {
          const selHere = this.sel.has(key(si, ni));
          const prevSel = this.sel.has(key(si, (ni - 1 + n) % n)) && (sp.closed || ni > 0);
          const nextSel = this.sel.has(key(si, (ni + 1) % n)) && (sp.closed || ni < n - 1);
          if ((selHere || prevSel) && Path.hasIn(nd) && (sp.closed || ni > 0)) out.push({ si, ni, which: 'in' });
          if ((selHere || nextSel) && Path.hasOut(nd) && (sp.closed || ni < n - 1)) out.push({ si, ni, which: 'out' });
        });
      });
      return out;
    },
    /** Parametric handles for primitive shapes (local coords). */
    paramHandles(o) {
      if (o.type === 'rect') return [{ id: 'r', x: o.x + Math.min(o.r || 0, o.w / 2), y: o.y, tip: 'Corner radius' }];
      if (o.type === 'ellipse')
        return [
          { id: 'rx', x: o.cx + o.rx, y: o.cy, tip: 'Width' },
          { id: 'ry', x: o.cx, y: o.cy - o.ry, tip: 'Height' },
        ];
      if (o.type === 'star') {
        const a1 = V3D.U.rad(o.rot - 90);
        const a2 = V3D.U.rad(o.rot + 180 / o.n - 90);
        const hs = [{ id: 'tip', x: o.cx + o.r1 * Math.cos(a1), y: o.cy + o.r1 * Math.sin(a1), tip: 'Size & rotation' }];
        if (o.star) hs.push({ id: 'inner', x: o.cx + o.r2 * Math.cos(a2), y: o.cy + o.r2 * Math.sin(a2), tip: 'Inner radius' });
        return hs;
      }
      return [];
    },

    down(ev) {
      const app = this.app;
      let o = this.target();
      const hitId = app.canvas.idFromTarget(ev.target, true);
      if (!o) {
        if (hitId && Doc.isShape(app.get(hitId))) {
          app.setSelection([hitId]);
          this.sel = new Set();
        } else if (hitId) app.setSelection([hitId]);
        return;
      }
      const { W, scr } = this.geo(o);
      const Wi = M2.invert(W);
      const local = (x, y) => M2.apply(Wi, x, y);
      // Primitive shape handles.
      if (o.type !== 'path') {
        for (const h of this.paramHandles(o)) {
          const p = scr(h.x, h.y);
          if (Math.hypot(p[0] - ev.sx, p[1] - ev.sy) <= HANDLE_R + 2) {
            this.s = { mode: 'param', h, local, orig: V3D.U.clone(o) };
            app.setDraft([o.id]);
            return;
          }
        }
        if (hitId && hitId !== o.id) app.setSelection([hitId]);
        else if (!hitId) app.setSelection([]);
        return;
      }
      // Handles.
      for (const h of this.visibleHandles(o)) {
        const nd = o.subs[h.si].nodes[h.ni];
        const p = h.which === 'in' ? scr(nd.ix, nd.iy) : scr(nd.ox, nd.oy);
        if (Math.hypot(p[0] - ev.sx, p[1] - ev.sy) <= HANDLE_R) {
          this.s = { mode: 'handle', h, local, alt: ev.alt };
          app.setDraft([o.id]);
          return;
        }
      }
      // Nodes.
      let best = null;
      o.subs.forEach((sp, si) =>
        sp.nodes.forEach((nd, ni) => {
          const p = scr(nd.x, nd.y);
          const d = Math.hypot(p[0] - ev.sx, p[1] - ev.sy);
          if (d <= HANDLE_R && (!best || d < best.d)) best = { si, ni, d };
        })
      );
      if (best) {
        const k = key(best.si, best.ni);
        if (ev.shift) {
          if (this.sel.has(k)) this.sel.delete(k);
          else this.sel.add(k);
        } else if (!this.sel.has(k)) this.sel = new Set([k]);
        this.s = { mode: 'nodes', local, x0: ev.x, y0: ev.y, orig: Path.clone(o.subs), moved: false };
        app.setDraft([o.id]);
        app.requestOverlay();
        app.bus.emit('nodes');
        return;
      }
      // Segments.
      const [lx, ly] = local(ev.x, ev.y);
      const near = Path.nearest(o.subs, lx, ly);
      if (near) {
        const np = M2.apply(W, near.x, near.y);
        const sp = app.canvas.toScreen(np[0], np[1]);
        if (Math.hypot(sp[0] - ev.sx, sp[1] - ev.sy) <= 6) {
          const sub = o.subs[near.sub];
          const a = near.seg;
          const b = (near.seg + 1) % sub.nodes.length;
          if (!ev.shift) this.sel = new Set();
          this.sel.add(key(near.sub, a));
          this.sel.add(key(near.sub, b));
          this.s = { mode: 'segment', near, local, x0: ev.x, y0: ev.y, orig: Path.clone(o.subs), moved: false };
          app.setDraft([o.id]);
          app.requestOverlay();
          app.bus.emit('nodes');
          return;
        }
      }
      if (hitId && hitId !== o.id && Doc.isShape(app.get(hitId))) {
        app.setSelection([hitId]);
        this.sel = new Set();
        return;
      }
      if (!ev.shift) this.sel = new Set();
      this.s = { mode: 'band', x0: ev.x, y0: ev.y, x1: ev.x, y1: ev.y };
      app.bus.emit('nodes');
    },

    move(ev) {
      const app = this.app;
      const s = this.s;
      const o = this.target();
      if (!s || !o) {
        if (!s) app.hover(ev.buttons ? null : app.canvas.idFromTarget(ev.target, true));
        return;
      }
      if (s.mode === 'band') {
        s.x1 = ev.x;
        s.y1 = ev.y;
        app.requestOverlay();
        return;
      }
      const sn = Snap.point(app, ev.x, ev.y, { exclude: new Set([o.id]) });
      const [lx, ly] = s.local(sn.x, sn.y);
      if (s.mode === 'param') {
        const h = s.h;
        const org = s.orig;
        if (h.id === 'r') o.r = Math.max(0, Math.min(lx - org.x, org.w / 2, org.h / 2));
        else if (h.id === 'rx') o.rx = Math.max(0.5, Math.abs(lx - org.cx));
        else if (h.id === 'ry') o.ry = Math.max(0.5, Math.abs(ly - org.cy));
        else if (h.id === 'tip') {
          o.r1 = Math.max(1, Math.hypot(lx - org.cx, ly - org.cy));
          let rot = V3D.U.deg(Math.atan2(ly - org.cy, lx - org.cx)) + 90;
          if (ev.shift) rot = Math.round(rot / 15) * 15;
          o.rot = rot;
          o.r2 = (org.r2 / org.r1) * o.r1;
        } else if (h.id === 'inner') o.r2 = Math.max(0.5, Math.hypot(lx - org.cx, ly - org.cy));
        app.touch(o);
        app.requestRender();
        return;
      }
      if (s.mode === 'handle') {
        const nd = o.subs[s.h.si].nodes[s.h.ni];
        const alt = ev.alt || s.alt;
        if (s.h.which === 'in') {
          nd.ix = lx;
          nd.iy = ly;
        } else {
          nd.ox = lx;
          nd.oy = ly;
        }
        if (alt) nd.t = 'c';
        else if (nd.t === 'z' || nd.t === 's') {
          const [hx, hy] = s.h.which === 'in' ? [nd.ix, nd.iy] : [nd.ox, nd.oy];
          const vx = nd.x - hx;
          const vy = nd.y - hy;
          const vl = Math.hypot(vx, vy) || 1;
          const other = s.h.which === 'in' ? [nd.ox, nd.oy] : [nd.ix, nd.iy];
          const ol = nd.t === 'z' ? vl : Math.hypot(other[0] - nd.x, other[1] - nd.y);
          const ox = nd.x + (vx / vl) * ol;
          const oy = nd.y + (vy / vl) * ol;
          if (s.h.which === 'in') {
            nd.ox = ox;
            nd.oy = oy;
          } else {
            nd.ix = ox;
            nd.iy = oy;
          }
        }
        app.touch(o);
        app.requestRender();
        return;
      }
      if (s.mode === 'nodes') {
        const [x0, y0] = s.local(s.x0, s.y0);
        let dx = lx - x0;
        let dy = ly - y0;
        if (ev.shift) {
          if (Math.abs(dx) > Math.abs(dy)) dy = 0;
          else dx = 0;
        }
        o.subs = Path.clone(s.orig);
        for (const k of this.sel) {
          const [si, ni] = parseKey(k);
          const nd = o.subs[si] && o.subs[si].nodes[ni];
          if (!nd) continue;
          nd.x += dx;
          nd.y += dy;
          nd.ix += dx;
          nd.iy += dy;
          nd.ox += dx;
          nd.oy += dy;
        }
        s.moved = true;
        app.touch(o);
        app.requestRender();
        return;
      }
      if (s.mode === 'segment') {
        const n = s.near;
        o.subs = Path.clone(s.orig);
        const sub = o.subs[n.sub];
        const a = sub.nodes[n.seg];
        const b = sub.nodes[(n.seg + 1) % sub.nodes.length];
        const [x0, y0] = s.local(s.x0, s.y0);
        const dx = lx - x0;
        const dy = ly - y0;
        if (!Path.hasOut(a) && !Path.hasIn(b)) {
          a.ox = a.x + (b.x - a.x) / 3;
          a.oy = a.y + (b.y - a.y) / 3;
          b.ix = a.x + ((b.x - a.x) * 2) / 3;
          b.iy = a.y + ((b.y - a.y) * 2) / 3;
        }
        const t = Math.min(0.9, Math.max(0.1, n.t));
        const k = 1 / (3 * t * (1 - t) * ((1 - t) * (1 - t) + t * t));
        a.ox += dx * k * (1 - t);
        a.oy += dy * k * (1 - t);
        b.ix += dx * k * t;
        b.iy += dy * k * t;
        if (a.t === 'c' && Path.hasIn(a)) a.t = 'c';
        s.moved = true;
        app.touch(o);
        app.requestRender();
      }
    },

    up() {
      const app = this.app;
      const s = this.s;
      this.s = null;
      if (!s) return;
      app.setDraft(null);
      const o = this.target();
      if (s.mode === 'band' && o && o.type === 'path') {
        const { scr } = this.geo(o);
        const [a1, b1] = app.canvas.toScreen(Math.min(s.x0, s.x1), Math.min(s.y0, s.y1));
        const [a2, b2] = app.canvas.toScreen(Math.max(s.x0, s.x1), Math.max(s.y0, s.y1));
        o.subs.forEach((sp, si) =>
          sp.nodes.forEach((nd, ni) => {
            const p = scr(nd.x, nd.y);
            if (p[0] >= a1 && p[0] <= a2 && p[1] >= b1 && p[1] <= b2) this.sel.add(key(si, ni));
          })
        );
        app.bus.emit('nodes');
        app.requestOverlay();
        return;
      }
      if (s.mode === 'param') app.commit('Edit shape');
      else if (s.mode === 'handle') app.commit('Move handle');
      else if ((s.mode === 'nodes' || s.mode === 'segment') && s.moved) app.commit(s.mode === 'nodes' ? 'Move nodes' : 'Bend segment');
      app.requestRender();
    },

    cancel() {
      this.s = null;
      this.app.setDraft(null);
    },

    dblclick(ev) {
      const app = this.app;
      const o = this.target();
      if (!o) return;
      if (o.type !== 'path') {
        app.convertToPath([o]);
        return;
      }
      const { W, scr } = this.geo(o);
      // Toggle a node's type…
      for (let si = 0; si < o.subs.length; si++)
        for (let ni = 0; ni < o.subs[si].nodes.length; ni++) {
          const nd = o.subs[si].nodes[ni];
          const p = scr(nd.x, nd.y);
          if (Math.hypot(p[0] - ev.sx, p[1] - ev.sy) <= HANDLE_R) {
            this.sel = new Set([key(si, ni)]);
            this.setType(nd.t === 'c' ? 's' : 'c');
            return;
          }
        }
      // …or insert a node on a segment.
      const Wi = M2.invert(W);
      const [lx, ly] = M2.apply(Wi, ev.x, ev.y);
      const near = Path.nearest(o.subs, lx, ly);
      if (!near) return;
      const np = M2.apply(W, near.x, near.y);
      const sp = app.canvas.toScreen(np[0], np[1]);
      if (Math.hypot(sp[0] - ev.sx, sp[1] - ev.sy) > 8) return;
      const ni = Path.splitSegment(o.subs[near.sub], near.seg, near.t);
      this.sel = new Set([key(near.sub, ni)]);
      app.touch(o);
      app.requestRender();
      app.commit('Add node');
      app.bus.emit('nodes');
    },

    key(e) {
      const o = this.target();
      if (!o || o.type !== 'path') return false;
      if ((e.key === 'Delete' || e.key === 'Backspace') && this.sel.size) {
        this.deleteNodes();
        return true;
      }
      if (V3D.U.modKey(e) && e.key.toLowerCase() === 'a') {
        this.sel = new Set();
        o.subs.forEach((sp, si) => sp.nodes.forEach((_, ni) => this.sel.add(key(si, ni))));
        this.app.requestOverlay();
        this.app.bus.emit('nodes');
        return true;
      }
      if (e.key.startsWith('Arrow') && this.sel.size) {
        const step = (e.shiftKey ? 10 : 1) / this.app.canvas.zoom;
        const d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
        const Wi = M2.invert(this.W(o));
        const [dx, dy] = M2.applyVec(Wi, d[0], d[1]);
        for (const k of this.sel) {
          const [si, ni] = parseKey(k);
          const nd = o.subs[si] && o.subs[si].nodes[ni];
          if (!nd) continue;
          for (const [a, b] of [['x', 'y'], ['ix', 'iy'], ['ox', 'oy']]) {
            nd[a] += dx;
            nd[b] += dy;
          }
        }
        this.app.touch(o);
        this.app.requestRender();
        this.app.commitSoon('Nudge nodes');
        return true;
      }
      if (e.key === 'Escape' && this.sel.size) {
        this.sel = new Set();
        this.app.requestOverlay();
        this.app.bus.emit('nodes');
        return true;
      }
      return false;
    },

    /* ----- node operations (also used by the tool controls bar) ----- */
    selectedNodes() {
      const o = this.target();
      if (!o || o.type !== 'path') return [];
      return Array.from(this.sel)
        .map(parseKey)
        .filter(([si, ni]) => o.subs[si] && o.subs[si].nodes[ni])
        .map(([si, ni]) => ({ si, ni, nd: o.subs[si].nodes[ni], sub: o.subs[si] }));
    },
    setType(t) {
      const o = this.target();
      if (!o || o.type !== 'path') return;
      for (const { nd, sub, ni } of this.selectedNodes()) {
        nd.t = t;
        if (t === 'c') continue;
        const n = sub.nodes.length;
        const prev = sub.nodes[(ni - 1 + n) % n];
        const next = sub.nodes[(ni + 1) % n];
        let tx = next.x - prev.x;
        let ty = next.y - prev.y;
        if (Path.hasIn(nd) && Path.hasOut(nd)) {
          tx = nd.ox - nd.ix;
          ty = nd.oy - nd.iy;
        }
        const tl = Math.hypot(tx, ty) || 1;
        tx /= tl;
        ty /= tl;
        const li = Path.hasIn(nd) ? Math.hypot(nd.ix - nd.x, nd.iy - nd.y) : Math.hypot(prev.x - nd.x, prev.y - nd.y) / 3;
        const lo = Path.hasOut(nd) ? Math.hypot(nd.ox - nd.x, nd.oy - nd.y) : Math.hypot(next.x - nd.x, next.y - nd.y) / 3;
        const L = t === 'z' ? (li + lo) / 2 : null;
        nd.ix = nd.x - tx * (L || li);
        nd.iy = nd.y - ty * (L || li);
        nd.ox = nd.x + tx * (L || lo);
        nd.oy = nd.y + ty * (L || lo);
      }
      this.app.touch(o);
      this.app.requestRender();
      this.app.commit('Node type');
    },
    segments(kind) {
      const o = this.target();
      if (!o || o.type !== 'path') return;
      for (const { si, ni } of this.selectedNodes()) {
        const sub = o.subs[si];
        const n = sub.nodes.length;
        const nj = (ni + 1) % n;
        if (!this.sel.has(key(si, nj)) || (!sub.closed && nj === 0)) continue;
        const a = sub.nodes[ni];
        const b = sub.nodes[nj];
        if (kind === 'line') {
          a.ox = a.x;
          a.oy = a.y;
          b.ix = b.x;
          b.iy = b.y;
          a.t = 'c';
          b.t = 'c';
        } else if (!Path.hasOut(a) && !Path.hasIn(b)) {
          a.ox = a.x + (b.x - a.x) / 3;
          a.oy = a.y + (b.y - a.y) / 3;
          b.ix = a.x + ((b.x - a.x) * 2) / 3;
          b.iy = a.y + ((b.y - a.y) * 2) / 3;
        }
      }
      this.app.touch(o);
      this.app.requestRender();
      this.app.commit(kind === 'line' ? 'Make lines' : 'Make curves');
    },
    insertNodes() {
      const o = this.target();
      if (!o || o.type !== 'path') return;
      const picks = this.selectedNodes().sort((p, q) => q.si - p.si || q.ni - p.ni);
      const next = new Set();
      for (const { si, ni, sub } of picks) {
        const n = sub.nodes.length;
        const nj = (ni + 1) % n;
        if (!this.sel.has(key(si, nj)) || (!sub.closed && nj === 0)) continue;
        const idx = Path.splitSegment(sub, ni, 0.5);
        next.add(key(si, idx));
      }
      if (next.size) this.sel = next;
      this.app.touch(o);
      this.app.requestRender();
      this.app.commit('Add nodes');
      this.app.bus.emit('nodes');
    },
    deleteNodes() {
      const app = this.app;
      const o = this.target();
      if (!o || o.type !== 'path') return;
      const bySub = new Map();
      for (const { si, ni } of this.selectedNodes()) (bySub.get(si) || bySub.set(si, []).get(si)).push(ni);
      for (const [si, list] of bySub) {
        const sub = o.subs[si];
        sub.nodes = sub.nodes.filter((_, i) => !list.includes(i));
      }
      o.subs = o.subs.filter((sp) => sp.nodes.length >= 2);
      this.sel = new Set();
      if (!o.subs.length) {
        app.deleteSelection();
        return;
      }
      app.touch(o);
      app.requestRender();
      app.commit('Delete nodes');
      app.bus.emit('nodes');
    },
    breakAtNodes() {
      const o = this.target();
      if (!o || o.type !== 'path') return;
      const picks = this.selectedNodes();
      if (!picks.length) return;
      const { si, ni, sub } = picks[0];
      const nodes = sub.nodes;
      let pieces;
      if (sub.closed) {
        const rot = nodes.slice(ni).concat(nodes.slice(0, ni));
        const end = Object.assign({}, rot[0]);
        rot[0] = Object.assign({}, rot[0], { ix: rot[0].x, iy: rot[0].y });
        end.ox = end.x;
        end.oy = end.y;
        pieces = [{ closed: false, nodes: rot.concat([end]) }];
      } else {
        if (ni === 0 || ni === nodes.length - 1) return;
        const a = nodes.slice(0, ni + 1).map((n) => ({ ...n }));
        const b = nodes.slice(ni).map((n) => ({ ...n }));
        a[a.length - 1].ox = a[a.length - 1].x;
        a[a.length - 1].oy = a[a.length - 1].y;
        b[0].ix = b[0].x;
        b[0].iy = b[0].y;
        pieces = [
          { closed: false, nodes: a },
          { closed: false, nodes: b },
        ];
      }
      o.subs.splice(si, 1, ...pieces);
      this.sel = new Set();
      this.app.touch(o);
      this.app.requestRender();
      this.app.commit('Break path');
      this.app.bus.emit('nodes');
    },
    joinNodes() {
      const o = this.target();
      if (!o || o.type !== 'path') return;
      const picks = this.selectedNodes().filter(({ sub, ni }) => !sub.closed && (ni === 0 || ni === sub.nodes.length - 1));
      if (picks.length !== 2) {
        this.app.toast('Select two end nodes to join');
        return;
      }
      const [p, q] = picks;
      if (p.si === q.si) {
        p.sub.closed = true;
      } else {
        let a = p.sub.nodes;
        let b = q.sub.nodes;
        if (p.ni === 0) a = Path.reverse([{ closed: false, nodes: a }])[0].nodes;
        if (q.ni !== 0) b = Path.reverse([{ closed: false, nodes: b }])[0].nodes;
        const merged = { closed: false, nodes: a.concat(b) };
        const keep = o.subs.filter((_, i) => i !== p.si && i !== q.si);
        o.subs = keep.concat([merged]);
      }
      this.sel = new Set();
      this.app.touch(o);
      this.app.requestRender();
      this.app.commit('Join nodes');
      this.app.bus.emit('nodes');
    },
    toggleClosed() {
      const o = this.target();
      if (!o || o.type !== 'path') return;
      const subs = new Set(this.selectedNodes().map((p) => p.si));
      if (!subs.size) o.subs.forEach((_, i) => subs.add(i));
      for (const si of subs) o.subs[si].closed = !o.subs[si].closed;
      this.app.touch(o);
      this.app.requestRender();
      this.app.commit('Open/close path');
    },

    overlay() {
      const app = this.app;
      const o = this.target();
      let out = '';
      const s = this.s;
      if (!o) return out;
      const { W, scr } = this.geo(o);
      const subs = Doc.worldSubs(o, app.parentMatrix(o.id));
      // Outline of the editable path, mapped to screen.
      const c = app.canvas;
      const screenSubs = Path.transform(subs, [c.zoom, 0, 0, c.zoom, c.x, c.y]);
      out += `<path d="${Path.toD(screenSubs, 1)}" class="ov-path"/>`;
      if (o.type !== 'path') {
        for (const h of this.paramHandles(o)) {
          const p = scr(h.x, h.y);
          out += `<circle cx="${fmt(p[0], 1)}" cy="${fmt(p[1], 1)}" r="5.5" class="ov-param"><title>${h.tip}</title></circle>`;
        }
        return out;
      }
      for (const h of this.visibleHandles(o)) {
        const nd = o.subs[h.si].nodes[h.ni];
        const a = scr(nd.x, nd.y);
        const b = h.which === 'in' ? scr(nd.ix, nd.iy) : scr(nd.ox, nd.oy);
        out += `<line x1="${fmt(a[0], 1)}" y1="${fmt(a[1], 1)}" x2="${fmt(b[0], 1)}" y2="${fmt(b[1], 1)}" class="ov-hline"/><circle cx="${fmt(b[0], 1)}" cy="${fmt(b[1], 1)}" r="3.5" class="ov-hdot"/>`;
      }
      o.subs.forEach((sp, si) =>
        sp.nodes.forEach((nd, ni) => {
          const p = scr(nd.x, nd.y);
          const cls = this.sel.has(key(si, ni)) ? 'ov-node sel' : 'ov-node';
          if (nd.t === 'c') out += `<rect x="${fmt(p[0] - 4, 1)}" y="${fmt(p[1] - 4, 1)}" width="8" height="8" class="${cls}"/>`;
          else if (nd.t === 'z') out += `<path d="M${fmt(p[0], 1)} ${fmt(p[1] - 5.5, 1)}l5.5 5.5l-5.5 5.5l-5.5 -5.5Z" class="${cls}"/>`;
          else out += `<circle cx="${fmt(p[0], 1)}" cy="${fmt(p[1], 1)}" r="4.5" class="${cls}"/>`;
        })
      );
      if (s && s.mode === 'band') {
        const [x1, y1] = c.toScreen(Math.min(s.x0, s.x1), Math.min(s.y0, s.y1));
        const [x2, y2] = c.toScreen(Math.max(s.x0, s.x1), Math.max(s.y0, s.y1));
        out += `<rect x="${x1}" y="${y1}" width="${x2 - x1}" height="${y2 - y1}" class="ov-band"/>`;
      }
      void W;
      return out;
    },
  };
})();

/* ---- js/tools-draw.js ---- */
/* Vector 3Dit — drawing tools: rectangle, ellipse, star/polygon, pen, pencil, text,
 * plus zoom and eyedropper. */
(function () {
  'use strict';
  const V3D = globalThis.V3D;
  const { M2, Path, Doc, Snap } = V3D;
  const { fmt } = V3D.U;
  const Tools = (V3D.Tools = V3D.Tools || {});

  /** Shared drag-to-create behaviour for primitive shapes. */
  function shapeTool(def) {
    return Object.assign(
      {
        cursor: 'crosshair',
        s: null,
        down(ev) {
          const app = this.app;
          const sn = Snap.point(app, ev.x, ev.y);
          this.s = { x0: sn.x, y0: sn.y, sx0: ev.sx, sy0: ev.sy, obj: null, guides: sn.guides };
        },
        move(ev) {
          const app = this.app;
          const s = this.s;
          if (!s) {
            const sn = Snap.point(app, ev.x, ev.y);
            this.hoverGuides = sn.guides;
            app.requestOverlay();
            return;
          }
          if (!s.obj && Math.hypot(ev.sx - s.sx0, ev.sy - s.sy0) < 3) return;
          const sn = Snap.point(app, ev.x, ev.y, { exclude: s.obj ? new Set([s.obj.id]) : null });
          s.guides = sn.guides;
          let x1 = sn.x;
          let y1 = sn.y;
          if (!s.obj) {
            s.obj = Doc.make(this.type, {}, app.newStyle());
            app.addObject(s.obj, { select: true, commit: false });
          }
          this.shape(s.obj, s.x0, s.y0, x1, y1, ev);
          app.touch(s.obj);
          app.requestRender();
          const b = app.bboxOf(s.obj);
          if (b) app.status(`${Doc.typeName(s.obj)}  ${fmt(V3D.Rect.w(b), 1)} × ${fmt(V3D.Rect.h(b), 1)}`, true);
        },
        up(ev) {
          const app = this.app;
          const s = this.s;
          this.s = null;
          app.status(null);
          if (!s) return;
          if (!s.obj) {
            // A plain click selects whatever is under the pointer.
            const id = app.canvas.idFromTarget(ev.target, false);
            app.setSelection(id ? [id] : []);
            return;
          }
          const b = app.bboxOf(s.obj);
          if (!b || (V3D.Rect.w(b) < 0.5 && V3D.Rect.h(b) < 0.5)) {
            app.removeObjects([s.obj.id], { commit: false });
            return;
          }
          app.commit('Draw ' + Doc.typeName(s.obj).toLowerCase());
        },
        cancel() {
          if (this.s && this.s.obj) this.app.removeObjects([this.s.obj.id], { commit: false });
          this.s = null;
        },
        overlay() {
          const g = this.s ? this.s.guides : this.hoverGuides;
          return Snap.guideMarkup(this.app, g);
        },
      },
      def
    );
  }

  const box = (x0, y0, x1, y1, ev) => {
    let w = x1 - x0;
    let h = y1 - y0;
    if (ev.shift) {
      const m = Math.max(Math.abs(w), Math.abs(h));
      w = Math.sign(w || 1) * m;
      h = Math.sign(h || 1) * m;
    }
    if (ev.alt) return { x: x0 - Math.abs(w), y: y0 - Math.abs(h), w: Math.abs(w) * 2, h: Math.abs(h) * 2 };
    return { x: Math.min(x0, x0 + w), y: Math.min(y0, y0 + h), w: Math.abs(w), h: Math.abs(h) };
  };

  Tools.rect = shapeTool({
    id: 'rect',
    name: 'Rectangle',
    shortcut: 'R',
    type: 'rect',
    hint: 'Drag to draw a rectangle. Shift makes a square, Alt draws from the center. Set rounded corners in the bar above.',
    shape(o, x0, y0, x1, y1, ev) {
      const b = box(x0, y0, x1, y1, ev);
      Object.assign(o, b, { r: this.app.toolOpts.rect.r || 0 });
    },
  });

  Tools.ellipse = shapeTool({
    id: 'ellipse',
    name: 'Ellipse',
    shortcut: 'E',
    type: 'ellipse',
    hint: 'Drag to draw an ellipse. Shift makes a circle, Alt draws from the center.',
    shape(o, x0, y0, x1, y1, ev) {
      const b = box(x0, y0, x1, y1, ev);
      Object.assign(o, { cx: b.x + b.w / 2, cy: b.y + b.h / 2, rx: b.w / 2, ry: b.h / 2 });
    },
  });

  Tools.star = shapeTool({
    id: 'star',
    name: 'Star & polygon',
    shortcut: 'S',
    type: 'star',
    hint: 'Drag from the center outward. Choose star or polygon, corners and sharpness in the bar above. Shift snaps the angle.',
    shape(o, x0, y0, x1, y1, ev) {
      const t = this.app.toolOpts.star;
      const r1 = Math.hypot(x1 - x0, y1 - y0);
      let rot = V3D.U.deg(Math.atan2(y1 - y0, x1 - x0)) + 90;
      if (ev.shift) rot = Math.round(rot / 15) * 15;
      Object.assign(o, { cx: x0, cy: y0, r1, r2: r1 * t.ratio, n: t.n, star: t.star, round: t.round, rot });
    },
  });

  /* ---------- pen ---------- */
  Tools.pen = {
    id: 'pen',
    name: 'Pen',
    shortcut: 'P',
    cursor: 'crosshair',
    hint: 'Click for corners, drag for curves. Click the first point to close the shape. Enter finishes an open line, Backspace removes the last point, Esc cancels.',
    nodes: [],
    drag: null,
    activate() {
      this.nodes = [];
      this.drag = null;
    },
    deactivate() {
      if (this.nodes.length >= 2) this.finish(false);
      this.nodes = [];
    },
    down(ev) {
      const app = this.app;
      const sn = Snap.point(app, ev.x, ev.y);
      const n = this.nodes;
      if (n.length >= 2) {
        const f = app.canvas.toScreen(n[0].x, n[0].y);
        if (Math.hypot(f[0] - ev.sx, f[1] - ev.sy) <= 8) {
          this.finish(true);
          return;
        }
      }
      let x = sn.x;
      let y = sn.y;
      if (ev.shift && n.length) ({ x, y } = constrain(n[n.length - 1], x, y));
      n.push(Path.node(x, y, 'c'));
      this.drag = { node: n[n.length - 1] };
      app.requestOverlay();
    },
    move(ev) {
      const app = this.app;
      this.cursor = [ev.x, ev.y];
      if (this.drag && ev.buttons) {
        const nd = this.drag.node;
        nd.ox = ev.x;
        nd.oy = ev.y;
        nd.ix = 2 * nd.x - ev.x;
        nd.iy = 2 * nd.y - ev.y;
        nd.t = 'z';
      }
      app.requestOverlay();
    },
    up() {
      this.drag = null;
    },
    dblclick() {
      // The double-click's second press added a duplicate point.
      if (this.nodes.length > 2) this.nodes.pop();
      this.finish(false);
    },
    key(e) {
      if (e.key === 'Enter') {
        this.finish(false);
        return true;
      }
      if (e.key === 'Escape') {
        if (this.nodes.length >= 2) this.finish(false);
        this.nodes = [];
        this.app.requestOverlay();
        return true;
      }
      if (e.key === 'Backspace' && this.nodes.length) {
        this.nodes.pop();
        this.app.requestOverlay();
        return true;
      }
      return false;
    },
    finish(closed) {
      const app = this.app;
      const nodes = this.nodes;
      this.nodes = [];
      this.drag = null;
      if (nodes.length < 2) {
        app.requestOverlay();
        return;
      }
      const sub = { closed, nodes };
      Path.inferTypes(sub);
      const style = app.newStyle();
      if (!closed) {
        style.stroke = style.stroke || (typeof style.fill === 'string' ? style.fill : '#1b1c22');
        style.fill = null;
        style.strokeWidth = style.strokeWidth || 3;
      }
      const o = Doc.make('path', { subs: [sub] }, style);
      app.addObject(o, { select: true, commit: true, label: 'Draw path' });
      app.requestOverlay();
    },
    overlay() {
      const app = this.app;
      const c = app.canvas;
      const n = this.nodes;
      if (!n.length) return '';
      const tmp = { closed: false, nodes: n.map((x) => ({ ...x })) };
      if (this.cursor && !this.drag) tmp.nodes.push(Path.node(this.cursor[0], this.cursor[1]));
      const scr = Path.transform([tmp], [c.zoom, 0, 0, c.zoom, c.x, c.y]);
      let out = `<path d="${Path.toD(scr, 1)}" class="ov-path pen"/>`;
      n.forEach((nd, i) => {
        const p = c.toScreen(nd.x, nd.y);
        if (Path.hasOut(nd)) {
          const a = c.toScreen(nd.ix, nd.iy);
          const b = c.toScreen(nd.ox, nd.oy);
          out += `<line x1="${fmt(a[0], 1)}" y1="${fmt(a[1], 1)}" x2="${fmt(b[0], 1)}" y2="${fmt(b[1], 1)}" class="ov-hline"/><circle cx="${fmt(a[0], 1)}" cy="${fmt(a[1], 1)}" r="3" class="ov-hdot"/><circle cx="${fmt(b[0], 1)}" cy="${fmt(b[1], 1)}" r="3" class="ov-hdot"/>`;
        }
        out += `<rect x="${fmt(p[0] - 4, 1)}" y="${fmt(p[1] - 4, 1)}" width="8" height="8" class="ov-node${i === 0 && n.length > 1 ? ' first' : ''}"/>`;
      });
      return out;
    },
  };

  function constrain(prev, x, y) {
    const a = Math.atan2(y - prev.y, x - prev.x);
    const s = Math.round(a / (Math.PI / 4)) * (Math.PI / 4);
    const d = Math.hypot(x - prev.x, y - prev.y);
    return { x: prev.x + Math.cos(s) * d, y: prev.y + Math.sin(s) * d };
  }

  /* ---------- pencil ---------- */
  Tools.pencil = {
    id: 'pencil',
    name: 'Pencil',
    shortcut: 'N',
    cursor: 'crosshair',
    hint: 'Draw freehand. End near your starting point to make a closed shape. Adjust smoothing in the bar above.',
    pts: null,
    down(ev) {
      this.pts = [[ev.x, ev.y]];
      this.start = [ev.sx, ev.sy];
    },
    move(ev) {
      if (!this.pts) return;
      const l = this.pts[this.pts.length - 1];
      if (Math.hypot(ev.x - l[0], ev.y - l[1]) * this.app.canvas.zoom >= 1.5) this.pts.push([ev.x, ev.y]);
      this.last = [ev.sx, ev.sy];
      this.app.requestOverlay();
    },
    up(ev) {
      const app = this.app;
      const pts = this.pts;
      this.pts = null;
      app.requestOverlay();
      if (!pts || pts.length < 3) return;
      const z = app.canvas.zoom;
      const closed = Math.hypot(ev.sx - this.start[0], ev.sy - this.start[1]) < 14 && pts.length > 6;
      const err = (0.6 + app.toolOpts.pencil.smooth * 0.35) / z;
      const segs = closed ? V3D.Fit.closed(pts, err, { cornerDeg: 70, span: 6 / z }) : V3D.Fit.open(pts, err, { cornerDeg: 70, span: 6 / z });
      if (!segs.length) return;
      const subs = Path.fromCubicRuns([{ closed, segs }]);
      const style = app.newStyle();
      if (!closed) {
        style.stroke = style.stroke || (typeof style.fill === 'string' ? style.fill : '#1b1c22');
        style.fill = null;
        style.strokeWidth = style.strokeWidth || 3;
      }
      app.addObject(Doc.make('path', { subs }, style), { select: true, commit: true, label: 'Draw freehand' });
    },
    cancel() {
      this.pts = null;
    },
    overlay() {
      if (!this.pts) return '';
      const c = this.app.canvas;
      return `<path d="M${this.pts.map((p) => c.toScreen(p[0], p[1]).map((v) => fmt(v, 1)).join(' ')).join('L')}" class="ov-path pen"/>`;
    },
  };

  /* ---------- text ---------- */
  Tools.text = {
    id: 'text',
    name: 'Text',
    shortcut: 'T',
    cursor: 'text',
    hint: 'Click to place text, or click existing text to edit it. Text becomes real vector outlines, ready for 3D.',
    down(ev) {
      const app = this.app;
      const id = app.canvas.idFromTarget(ev.target, true);
      const o = id && app.get(id);
      if (o && o.type === 'text') {
        this.edit(o);
        return;
      }
      if (app.ui.textEditorOpen()) {
        app.ui.closeTextEditor();
        return;
      }
      const ts = app.toolOpts.text;
      const t = Doc.make(
        'text',
        { text: '', x: ev.x, y: ev.y + ts.size * 0.35, family: ts.family, size: ts.size, weight: ts.weight, italic: ts.italic, spacing: ts.spacing, align: ts.align },
        app.newStyle()
      );
      app.addObject(t, { select: true, commit: false });
      this.edit(t, true);
    },
    edit(o, isNew) {
      this.app.setSelection([o.id]);
      this.app.ui.openTextEditor(o, isNew);
    },
  };

  /* ---------- zoom ---------- */
  Tools.zoom = {
    id: 'zoom',
    name: 'Zoom',
    shortcut: 'Z',
    cursor: 'zoom-in',
    hint: 'Click to zoom in, Alt-click to zoom out, drag to zoom into an area.',
    down(ev) {
      this.s = { x0: ev.x, y0: ev.y, x1: ev.x, y1: ev.y, sx: ev.sx, sy: ev.sy };
    },
    move(ev) {
      if (!this.s) return;
      this.s.x1 = ev.x;
      this.s.y1 = ev.y;
      this.app.requestOverlay();
    },
    up(ev) {
      const s = this.s;
      this.s = null;
      if (!s) return;
      const r = V3D.Rect.fromPoints(s.x0, s.y0, s.x1, s.y1);
      if (V3D.Rect.w(r) * this.app.canvas.zoom > 8) this.app.canvas.fit(r, 10);
      else this.app.canvas.zoomAt(ev.alt || ev.button === 2 ? 0.5 : 2, ev.sx, ev.sy);
      this.app.requestOverlay();
    },
    overlay() {
      const s = this.s;
      if (!s) return '';
      const c = this.app.canvas;
      const [x1, y1] = c.toScreen(Math.min(s.x0, s.x1), Math.min(s.y0, s.y1));
      const [x2, y2] = c.toScreen(Math.max(s.x0, s.x1), Math.max(s.y0, s.y1));
      return `<rect x="${x1}" y="${y1}" width="${x2 - x1}" height="${y2 - y1}" class="ov-band"/>`;
    },
  };

  Tools.hand = {
    id: 'hand',
    name: 'Hand',
    shortcut: 'H',
    cursor: 'grab',
    hint: 'Drag to pan around. Tip: hold Space with any tool to pan.',
  };

  /* ---------- eyedropper ---------- */
  Tools.eyedropper = {
    id: 'eyedropper',
    name: 'Eyedropper',
    shortcut: 'I',
    cursor: 'copy',
    hint: 'Click any color on the canvas to apply it to the selection (or to new shapes). Shift-click sets the outline color.',
    down(ev) {
      const app = this.app;
      let color = null;
      const t = ev.target;
      if (t && t.getAttribute) {
        const f = t.getAttribute('fill');
        if (f && !f.startsWith('url') && f !== 'none' && f !== 'transparent') color = V3D.Color.normalize(f);
      }
      if (!color) {
        const id = app.canvas.idFromTarget(t, true);
        const o = id && app.get(id);
        if (o && o.style) color = V3D.R3D.solidOf(o.style.fill);
      }
      if (!color) {
        if (t === app.canvas.svg || (t && t.classList && t.classList.contains('page'))) color = app.doc.background || '#ffffff';
      }
      if (!color) return;
      app.applyColor(color, ev.shift ? 'stroke' : 'fill');
      app.toast(`Picked ${color}`);
    },
  };
})();

/* ---- js/tools-3d.js ---- */
/* Vector 3Dit — 3D tools: Orbit (rotate objects in 3D by dragging) and Light (aim the light). */
(function () {
  'use strict';
  const V3D = globalThis.V3D;
  const { M3, V3, Doc, R3D } = V3D;
  const { fmt, clamp } = V3D.U;
  const Tools = (V3D.Tools = V3D.Tools || {});

  Tools.orbit = {
    id: 'orbit',
    name: '3D orbit',
    shortcut: 'O',
    cursor: 'grab',
    hint: 'Drag a shape to spin it in 3D. Flat shapes are extruded automatically. Shift locks to one axis, Alt spins in the drawing plane.',
    s: null,
    down(ev) {
      const app = this.app;
      const id = app.canvas.idFromTarget(ev.target, false);
      if (id && !app.sel.includes(id)) app.setSelection([id]);
      const objs = app.fxTargets();
      if (!objs.length) {
        if (!id) app.toast('Select a shape, then drag to rotate it in 3D');
        else app.toast('Images can’t be rotated in 3D — trace them into shapes first.');
        return;
      }
      let added = false;
      const pivots = app.groupPivots();
      for (const o of objs)
        if (!o.fx) {
          const b = app.bboxOf(o);

    move(ev) {

    up() {

      app.commit('Move light');
    },
    cancel() {
      this.s = null;

      let py = cy - L[1] * r;

        const k = 1 + -L[2];

        py = cy - (L[1] / d) * r * k;
      }
      let out = `<circle cx="${fmt(cx, 1)}" cy="${fmt(cy, 1)}" r="${fmt(r, 1)}" class="ov-orbit"/><circle cx="${fmt(cx, 1)}" cy="${fmt(cy, 1)}" r="${fmt(r * 2, 1)}" class="ov-orbit faint"/>`;
      out += `<line x1="${fmt(px, 1)}" y1="${fmt(py, 1)}" x2="${fmt(cx, 1)}" y2="${fmt(cy, 1)}" class="ov-lightray"/>`;
      out += `<g transform="translate(${fmt(px, 1)} ${fmt(py, 1)})" class="ov-sun"><circle r="8"/>${[0, 45, 90, 135, 180, 225, 270, 315]

          const c = Math.cos((a * Math.PI) / 180);
          const s = Math.sin((a * Math.PI) / 180);
          return `<line x1="${fmt(c * 11, 1)}" y1="${fmt(s * 11, 1)}" x2="${fmt(c * 15, 1)}" y2="${fmt(s * 15, 1)}"/>`;
        })
        .join('')}</g>`;
      return out;
    },
  };

      const nameOf = () => el.getAttribute('inkscape:label') || el.getAttribute('id') || '';
      const push = (type, props, subsForStyle) => {
        const o = Doc.make(type, Object.assign({ name: nameOf() }, props), toStyle(st, subsForStyle));
        o.transform = m;
        list.push(o);
        return o;
      };
      switch (tag) {
        case 'svg':
        case 'g':
        case 'a':
        case 'switch': {
          let mm = m;
          if (tag === 'svg' && depth > 0) {
            const x = lengthOf(el.getAttribute('x'));
            const y = lengthOf(el.getAttribute('y'));
            mm = M2.mul(mm, M2.translate(x, y));
          }
          if (tag === 'svg') {
            const vb = (el.getAttribute('viewBox') || '').split(/[\s,]+/).map(parseFloat);
            const w = lengthOf(el.getAttribute('width'), vb[2] || 0);
            const h = lengthOf(el.getAttribute('height'), vb[3] || 0);
            if (vb.length === 4 && vb.every(isFinite) && vb[2] > 0 && vb[3] > 0 && w && h) {
              const k = Math.min(w / vb[2], h / vb[3]);
              mm = M2.mul(mm, M2.mul(M2.scale(k, k), M2.translate(-vb[0], -vb[1])));
            }
          }
          const kids = [];
          for (const c of Array.from(el.children)) walk(c, tag === 'g' || tag === 'a' ? M2.identity() : mm, st, kids, depth + 1);
          if (!kids.length) return;
          if (tag === 'g' || tag === 'a') {
            const g = Doc.make('group', { children: kids, name: nameOf() });
            g.transform = m;
            g.style.opacity = st.opacity == null ? 1 : parseFloat(st.opacity);
            if (kids.length === 1 && g.style.opacity === 1 && !g.name) {
              kids[0].transform = M2.mul(m, kids[0].transform);
              list.push(kids[0]);
            } else list.push(g);
          } else list.push(...kids);
          return;
        }
        case 'path': {
          const subs = Path.parse(el.getAttribute('d'));
          if (subs.length) push('path', { subs });
          return;
        }
        case 'rect': {
          const w = lengthOf(el.getAttribute('width'));
          const h = lengthOf(el.getAttribute('height'));
          if (w <= 0 || h <= 0) return;
          const rx = lengthOf(el.getAttribute('rx'), lengthOf(el.getAttribute('ry')));
          push('rect', { x: lengthOf(el.getAttribute('x')), y: lengthOf(el.getAttribute('y')), w, h, r: rx });
          return;
        }
        case 'circle': {
          const r = lengthOf(el.getAttribute('r'));
          if (r > 0) push('ellipse', { cx: lengthOf(el.getAttribute('cx')), cy: lengthOf(el.getAttribute('cy')), rx: r, ry: r });
          return;
        }
        case 'ellipse': {
          const rx = lengthOf(el.getAttribute('rx'));
          const ry = lengthOf(el.getAttribute('ry'));
          if (rx > 0 && ry > 0) push('ellipse', { cx: lengthOf(el.getAttribute('cx')), cy: lengthOf(el.getAttribute('cy')), rx, ry });
          return;
        }
        case 'line': {
          const pts = [
            [lengthOf(el.getAttribute('x1')), lengthOf(el.getAttribute('y1'))],
            [lengthOf(el.getAttribute('x2')), lengthOf(el.getAttribute('y2'))],
          ];
          const o = push('path', { subs: [Path.fromPolyline(pts, false)] });
          o.style.fill = null;
          if (!o.style.stroke) o.style.stroke = '#000000';
          return;
        }
        case 'polyline':
        case 'polygon': {
          const nums = (el.getAttribute('points') || '').match(/[+-]?(?:\d*\.\d+|\d+\.?)(?:[eE][+-]?\d+)?/g) || [];
          const pts = [];
          for (let i = 0; i + 1 < nums.length; i += 2) pts.push([+nums[i], +nums[i + 1]]);
          if (pts.length < 2) return;
          push('path', { subs: [Path.fromPolyline(pts, tag === 'polygon')] });
          return;
        }
        case 'text': {
          const txt = el.textContent.trim();
          if (!txt) return;
          const size = lengthOf(st['font-size'], 16);
          const fam = (st['font-family'] || 'sans-serif').replace(/['"]/g, '');
          const anchor = el.getAttribute('text-anchor') || (parseDecl(el.getAttribute('style'))['text-anchor'] || 'start');
          const ts = el.getElementsByTagName('tspan')[0];
          const x = lengthOf(el.getAttribute('x'), ts ? lengthOf(ts.getAttribute('x')) : 0);
          const y = lengthOf(el.getAttribute('y'), ts ? lengthOf(ts.getAttribute('y')) : 0);
          const weight = st['font-weight'] === 'bold' ? 700 : parseInt(st['font-weight'], 10) || 400;
          push('text', { text: txt, x, y, size, family: fam, weight, italic: st['font-style'] === 'italic', align: anchor === 'middle' ? 'middle' : anchor === 'end' ? 'end' : 'start' });
          return;
        }
        case 'image': {
          const href = el.getAttribute('href') || el.getAttributeNS('http://www.w3.org/1999/xlink', 'href');
          if (!href) return;
          push('image', { href, x: lengthOf(el.getAttribute('x')), y: lengthOf(el.getAttribute('y')), w: lengthOf(el.getAttribute('width'), 100), h: lengthOf(el.getAttribute('height'), 100) });
          return;
        }
        case 'use': {
          const href = el.getAttribute('href') || el.getAttributeNS('http://www.w3.org/1999/xlink', 'href');
          const ref = href && href[0] === '#' && ids.get(href.slice(1));
          if (!ref) return;
          const mm = M2.mul(m, M2.translate(lengthOf(el.getAttribute('x')), lengthOf(el.getAttribute('y'))));
          const kids = [];
          const refTag = ref.nodeName.toLowerCase();
          if (refTag === 'symbol') for (const c of Array.from(ref.children)) walk(c, mm, st, kids, depth + 1);
          else walk(ref, mm, st, kids, depth + 1);
          list.push(...kids);
          return;
        }
        default:
          return;
      }
    };
    walk(root, M2.identity(), {}, out, 0);
    return out;
  };

  /** Rendered 3D markup → a group of editable path objects (in the given parent space). */
  IO.markupToGroup = (markup, parentM) => {
    const doc = new DOMParser().parseFromString(`<svg xmlns="${SVGNS}">${markup}</svg>`, 'image/svg+xml');
    const Pi = M2.invert(parentM || M2.identity());
    const defs = new Map();
    for (const el of Array.from(doc.querySelectorAll('linearGradient,radialGradient,filter'))) defs.set(el.getAttribute('id'), el);
    const grad = (ref) => {
      const m = /url\(#([^)]+)\)/.exec(ref || '');
      const g = m && defs.get(m[1]);
      if (!g) return null;
      const stops = Array.from(g.getElementsByTagName('stop')).map((s) => ({
        offset: parseFloat(s.getAttribute('offset')) || 0,
        color: Color.normalize(s.getAttribute('stop-color')),
        opacity: s.hasAttribute('stop-opacity') ? parseFloat(s.getAttribute('stop-opacity')) : 1,
      }));
      if (g.nodeName === 'radialGradient') {
        if (g.getAttribute('gradientUnits') === 'userSpaceOnUse') {
          const gt = g.hasAttribute('gradientTransform') ? M2.parse(g.getAttribute('gradientTransform')) : M2.identity();
          return { type: 'radial', units: 'user', stops, cx: +g.getAttribute('cx'), cy: +g.getAttribute('cy'), r: +g.getAttribute('r'), gt: M2.mul(Pi, gt) };
        }
        return { type: 'radial', stops, cx: 0.5, cy: 0.5, r: 0.5 };
      }
      const gt = g.hasAttribute('gradientTransform') ? M2.parse(g.getAttribute('gradientTransform')) : M2.identity();
      return { type: 'linear', units: 'user', stops, x1: +g.getAttribute('x1'), y1: +g.getAttribute('y1'), x2: +g.getAttribute('x2'), y2: +g.getAttribute('y2'), gt: M2.mul(Pi, gt) };
    };
    const kids = [];
    const walk = (el, opacity, blur, inh) => {
      for (const c of Array.from(el.children)) {
        const tag = c.nodeName;
        if (tag === 'defs') continue;
        if (tag === 'g') {
          const op = c.hasAttribute('opacity') ? parseFloat(c.getAttribute('opacity')) : 1;
          let b = blur;
          const fm = /url\(#([^)]+)\)/.exec(c.getAttribute('filter') || '');
          if (fm && defs.get(fm[1])) {
            const gb = defs.get(fm[1]).getElementsByTagName('feGaussianBlur')[0];
            if (gb) b = parseFloat(gb.getAttribute('stdDeviation')) || 0;
          }
          const inh2 = {
            sw: c.hasAttribute('stroke-width') ? parseFloat(c.getAttribute('stroke-width')) : inh.sw,
            join: c.getAttribute('stroke-linejoin') || inh.join,
          };
          walk(c, opacity * op, b, inh2);
          continue;
        }
        let subs;
        if (tag === 'path') subs = Path.parse(c.getAttribute('d'));
        else if (tag === 'ellipse')
          subs = Shapes.ellipse(+c.getAttribute('cx'), +c.getAttribute('cy'), +c.getAttribute('rx'), +c.getAttribute('ry'));
        else continue;
        if (!subs.length) continue;
        const fill = c.getAttribute('fill');
        const stroke = c.getAttribute('stroke');
        const style = Doc.defaultStyle();
        style.fill = !fill || fill === 'none' ? null : fill.startsWith('url') ? grad(fill) : Color.normalize(fill);
        const sw = c.hasAttribute('stroke-width') ? parseFloat(c.getAttribute('stroke-width')) : inh.sw || 1;
        style.stroke = !stroke || stroke === 'none' ? null : stroke.startsWith('url') ? grad(stroke) : Color.normalize(stroke);
        style.strokeWidth = sw;
        style.strokeJoin = c.getAttribute('stroke-linejoin') || inh.join || 'miter';
        style.strokeCap = c.getAttribute('stroke-linecap') || 'butt';
        style.fillRule = c.getAttribute('fill-rule') === 'evenodd' ? 'evenodd' : 'nonzero';
        // A stroke painted like the fill is a seam cover: keep it one screen pixel wide.
        if (c.getAttribute('vector-effect') === 'non-scaling-stroke' || (stroke && stroke === fill)) style.seam = true;
        const op = (c.hasAttribute('opacity') ? parseFloat(c.getAttribute('opacity')) : 1) * opacity;
        style.opacity = op;
        if (c.hasAttribute('fill-opacity') && typeof style.fill === 'string') {
          const fc = Color.parse(style.fill);
          fc.a = parseFloat(c.getAttribute('fill-opacity'));
          style.fill = Color.toHexA(fc);
        }
        if (blur) style.blur = blur;
        kids.push(Doc.make('path', { subs: Path.transform(subs, Pi) }, style));
      }
    };
    walk(doc.documentElement, 1, 0, { sw: 0, join: null });
    return Doc.make('group', { children: kids });
  };
})();

          const ny = -(y - N / 2) / R;
          const d = nx * nx + ny * ny;
          const i = (y * N + x) * 4;

          const nz = Math.sqrt(1 - d);

      let py = N / 2 - L[1] * R;

      if (behind) {
        const len = Math.hypot(L[0], L[1]) || 1;

      let y = -(e.clientY - r.top - r.height / 2) / (r.height / 2 - 2);
      const d = Math.hypot(x, y);
      let z;
      if (d <= 1) z = Math.sqrt(1 - d * d);
      else {
        x /= d;
        y /= d;
        z = -Math.min(1, (d - 1) * 2);
        const s = Math.sqrt(Math.max(0, 1 - z * z));
        x *= s;
        y *= s;

      const a = V3.toAngles([x, y, z]);

    el.addEventListener('pointerdown', (e) => {
      el.setPointerCapture(e.pointerId);
      dragging = true;
      fromEvent(e, false);
    });
    el.addEventListener('pointermove', (e) => dragging && fromEvent(e, false));
    el.addEventListener('pointerup', (e) => {
      if (!dragging) return;
      dragging = false;
      fromEvent(e, true);
    });

      const d = { ArrowLeft: [-5, 0], ArrowRight: [5, 0], ArrowUp: [0, 5], ArrowDown: [0, -5] }[e.key];

      e.preventDefault();
      const L = o.get();
      o.set({ az: L.az + d[0], el: clamp(L.el + d[1], -89, 89) }, true);
      draw();
    });
    el.sync = draw;
    draw();
    return el;
  };

          get: () => fx().kind,
          set: (v) => {
            app.setFxMany({ kind: v }, R3D.kinds[v].name);
          },
        })
      );
      const count = app.fxTargets(true).length;
      this.el.append(
        h('div.fx-head', h('div.fx-title', h('span', { html: V3D.icon('cube') }), h('span', count > 1 ? `${count} 3D shapes` : Doc.label(t))), W.iconButton('close', 'Remove 3D', () => app.remove3D(), 'danger')),
        kind
      );
      if (count > 1 || app.parentOf(t.id))
        this.el.append(
          h(
            'div.fx-group',
            add(
              W.toggle({
                label: 'Turn together as one object',
                title: 'On: every shape rotates around the group’s centre. Off: each shape spins around its own centre.',
                get: () => !!(this.fx() && this.fx().pivot),
                set: (v) => app.groupRotate(v),
              })
            )
          )
        );

      // View.
      const tb = add(
        W.trackball({
          get: () => [fx().rx, fx().ry, fx().rz],
          set: (r, final) => {
            const objs = app.fxTargets(true);
            objs.forEach((o) => {
              o.fx.rx = r[0];
              o.fx.ry = r[1];
              o.fx.rz = r[2];
              app.touch(o);
            });
            if (final) app.setDraft(null);
            else app.setDraft(objs.map((o) => o.id));
            app.requestRender();
            if (final) app.commit('Rotate in 3D');
            app.bus.emit('fx');
          },
        })
      );
      const presets = h(
        'div.presets',
        R3D.presets.map((p) =>
          h(
            'button.preset',
            {
              type: 'button',
              title: p.name,
              onclick: () => app.setFxMany({ rx: p.r[0], ry: p.r[1], rz: p.r[2] }, 'View: ' + p.name),
            },
            h('span.preset-thumb'),
            h('span.preset-name', p.name)
          )
        )
      );
      paintPresetThumbs(presets);
      const rot = ['rx', 'ry', 'rz'].map((k, i) =>
        add(
          W.slider({
            label: ['Tilt', 'Turn', 'Spin'][i],
            axis: 'xyz'[i],
            title: ['Rotate around the horizontal axis (X)', 'Rotate around the vertical axis (Y)', 'Rotate within the drawing plane (Z)'][i],
            min: -180,
            max: 180,
            step: 1,
            unit: '°',
            def: 0,
            get: () => fx()[k],
            set: set(k),
          })
        )
      );
      const persp = add(W.slider({ label: 'Perspective', min: 0, max: 160, step: 1, unit: '°', def: 0, title: 'Camera field of view. 0 = no perspective (parallel lines stay parallel).', get: () => fx().persp, set: set('persp') }));
      this.el.append(
        W.section('view', 'View & rotation', [
          h(
            'div.tb-row',
            tb,
            h(
              'div.tb-side',
              h('p.muted.small', 'Drag the cube to turn the object. Shift locks one axis, Alt spins it flat.'),
              W.button({ label: 'Face front', cls: 'small', icon: 'rotCCW', title: 'Reset rotation', onClick: () => app.setFxMany({ rx: 0, ry: 0, rz: 0 }, 'Reset rotation') })
            )
          ),
          rot,
          persp,
          h('div.sub-label', 'Preset views'),
          presets,
        ])
      );

      // Shape.
      const shapeKids = [];
      if (f.kind === 'extrude') {
        shapeKids.push(add(W.slider({ label: 'Depth', min: 0, max: 400, step: 1, unit: 'px', hardMin: 0, get: () => fx().depth, set: set('depth') })));
        shapeKids.push(add(W.toggle({ label: 'Solid (end caps)', title: 'Turn off for a hollow tube', get: () => fx().caps !== false, set: set('caps') })));
        const bev = add(W.bevelPicker({ get: () => fx().bevel, set: (v) => app.setFxMany({ bevel: v }, 'Bevel') }));
        shapeKids.push(W.row('Bevel', bev));
        if (f.bevel !== 'none') {
          shapeKids.push(add(W.slider({ label: 'Bevel width', min: 0, max: 60, step: 0.5, unit: 'px', hardMin: 0, get: () => fx().bevelW, set: set('bevelW') })));
          shapeKids.push(add(W.slider({ label: 'Bevel height', min: 0, max: 60, step: 0.5, unit: 'px', hardMin: 0, get: () => fx().bevelH, set: set('bevelH') })));
          shapeKids.push(
            W.row(
              'Bevel on',
              add(W.segmented({ options: [{ value: 'front', label: 'Front' }, { value: 'both', label: 'Front & back' }], get: () => fx().bevelSides, set: set('bevelSides') }))
            )
          );
          shapeKids.push(
            W.row(
              'Direction',
              add(W.segmented({ options: [{ value: false, label: 'Inward', title: 'Carve the bevel into the shape' }, { value: true, label: 'Outward', title: 'Grow the bevel outside the shape' }], get: () => !!fx().bevelOut, set: set('bevelOut') }))
            )
          );
          shapeKids.push(add(W.slider({ label: 'Smoothness', min: 1, max: 12, step: 1, get: () => fx().bevelSegs, set: set('bevelSegs') })));
        }
      } else if (f.kind === 'revolve') {
        shapeKids.push(h('p.tip', 'The shape spins around a vertical axis. Draw half a profile (like half a vase) with its straight side on the axis.'));
        shapeKids.push(
          W.row(
            'Axis',
            add(
              W.segmented({
                options: [
                  { value: 'left', label: 'Left edge' },
                  { value: 'center', label: 'Center' },
                  { value: 'right', label: 'Right edge' },
                ],
                get: () => fx().revAxis,
                set: set('revAxis'),
              })
            )
          )
        );
        shapeKids.push(add(W.slider({ label: 'Angle', min: 1, max: 360, step: 1, unit: '°', def: 360, get: () => fx().revAngle, set: set('revAngle') })));
        shapeKids.push(add(W.slider({ label: 'Offset', min: 0, max: 300, step: 1, unit: 'px', def: 0, title: 'Distance from the axis — makes rings and hollow shapes', get: () => fx().revOffset, set: set('revOffset') })));
        shapeKids.push(add(W.slider({ label: 'Segments', min: 6, max: 128, step: 1, def: 48, title: 'More segments = smoother, larger file', get: () => fx().revSegs, set: set('revSegs') })));
        if (f.revAngle < 360) shapeKids.push(add(W.toggle({ label: 'Cap the cut ends', get: () => fx().revCaps !== false, set: set('revCaps') })));
      } else if (f.kind === 'inflate') {
        shapeKids.push(add(W.slider({ label: 'Puffiness', min: 0, max: 300, step: 1, unit: 'px', get: () => fx().infH, set: set('infH') })));
        shapeKids.push(
          W.row(
            'Profile',
            add(W.select({ bare: true, label: 'Profile', options: Object.keys(V3D.Mesh.inflateProfiles).map((k) => ({ value: k, label: V3D.Mesh.inflateProfiles[k].name })), get: () => fx().infProfile, set: set('infProfile') }))
          )
        );
        shapeKids.push(add(W.slider({ label: 'Roundness', min: 5, max: 100, step: 1, unit: '%', def: 100, title: 'How far in from the edge the surface keeps rising', get: () => Math.round(fx().infSpread * 100), set: (v, fl) => app.setFx('infSpread', v / 100, fl) })));
        shapeKids.push(
          W.row(
            'Sides',
            add(W.segmented({ options: [{ value: 'both', label: 'Both sides' }, { value: 'front', label: 'Front only' }], get: () => fx().infSides, set: set('infSides') }))
          )
        );
        shapeKids.push(add(W.slider({ label: 'Detail', min: 12, max: 120, step: 1, def: 40, title: 'Mesh resolution. Higher is smoother but slower and larger', get: () => fx().infDetail, set: set('infDetail') })));
      } else {
        shapeKids.push(h('p.tip', 'Flat keeps the artwork paper-thin — tilt it with the view controls to lay it on a floor, wall or box side.'));
      }
      this.el.append(W.section('shape', 'Shape', shapeKids));

      // Surface.
      const mats = h(
        'div.materials',
        V3D.Presets.materials.map((m) =>
          h(
            'button.mat',
            {
              type: 'button',
              title: m.name,
              onclick: () => {
                const props = Object.assign({ edges: 'none', steps: 0 }, m.fx);
                if (m.fill) app.setStyle({ fill: m.fill }, false);
                app.setFxMany(props, 'Material: ' + m.name);
              },
            },
            h('span.mat-ball', { 'data-mat': m.id, style: { '--c': m.fill || 'var(--mat-base)' } }),
            h('span.mat-name', m.name)
          )
        )
      );
      const shadingSel = add(
        W.select({ label: 'Shading', options: Object.keys(R3D.shadings).map((k) => ({ value: k, label: R3D.shadings[k].name })), get: () => fx().shading, set: set('shading') })
      );
      const surf = [mats, shadingSel];
      if (!['flat', 'lineart', 'wire'].includes(f.shading)) {
        surf.push(add(W.toggle({ label: 'Smooth gradients', title: 'Draw curved surfaces with vector gradients instead of flat facets', get: () => fx().smooth, set: set('smooth') })));
        surf.push(add(W.slider({ label: 'Color bands', min: 0, max: 10, step: 1, def: 0, title: '0 = continuous shading. 2–6 gives a poster / cel look.', get: () => fx().steps, set: set('steps') })));
        surf.push(add(W.slider({ label: 'Smoothing angle', min: 0, max: 90, step: 1, unit: '°', def: 35, title: 'Edges sharper than this stay crisp', get: () => fx().smoothAngle, set: set('smoothAngle') })));
      }
      this.el.append(W.section('surface', 'Surface & material', surf));

      // Colors.
      const colorKids = [];
      colorKids.push(
        add(
          W.colorButton({
            label: 'Front',
            title: 'Main color (the shape’s fill)',
            get: () => (t.style.fill && typeof t.style.fill === 'object' ? t.style.fill : t.style.fill),
            set: (c, final) => app.setStyle({ fill: c || '#cccccc' }, final, 'Fill color'),
          })
        )
      );
      const autoColor = (prop, label, title) =>
        add(
          W.colorButton({
            label,
            title,
            allowNone: true,
            autoLabel: 'Auto',
            onAuto: () => app.setFxMany({ [prop]: null }, label + ' color'),
            get: () => fx()[prop],
            fallback: () => R3D.solidOf(t.style.fill) || '#888888',
            set: (c, final) => app.setFx(prop, c, final),
          })
        );
      if (f.kind === 'extrude' || f.kind === 'revolve') colorKids.push(autoColor('sideColor', 'Sides', 'Color of the extruded sides (Auto = same as front)'));
      if (f.kind === 'extrude' && f.bevel !== 'none') colorKids.push(autoColor('bevelColor', 'Bevel', 'Color of the bevel (Auto = same as sides)'));
      colorKids.push(autoColor('backColor', 'Back', 'Color of the back face'));
      if (!['flat', 'lineart', 'wire'].includes(f.shading)) {
        colorKids.push(
          W.row(
            'Shadow tone',
            add(
              W.segmented({
                options: [
                  { value: 'auto', label: 'Tinted', title: 'Shadows shift toward a deep cool tone of the base color' },
                  { value: 'black', label: 'Black' },
                  { value: 'custom', label: 'Custom' },
                ],
                get: () => (fx().shadowTint === 'auto' || fx().shadowTint === 'black' ? fx().shadowTint : 'custom'),
                set: (v) => app.setFxMany({ shadowTint: v === 'custom' ? '#2a2350' : v }, 'Shadow tone'),
              })
            )
          )
        );
        if (f.shadowTint !== 'auto' && f.shadowTint !== 'black')
          colorKids.push(add(W.colorButton({ label: 'Shadow color', get: () => fx().shadowTint, set: (c, fl) => app.setFx('shadowTint', c || 'auto', fl) })));
        colorKids.push(add(W.colorButton({ label: 'Highlight', title: 'Color of the brightest spots', get: () => fx().highlight, set: (c, fl) => app.setFx('highlight', c || '#ffffff', fl) })));
      }
      this.el.append(W.section('colors', 'Colors', colorKids));

      // Light.
      this.el.append(this.lightSection(false, t));

      // Outline & shadow.
      const extra = [];
      extra.push(
        W.row(
          'Edge lines',
          add(
            W.segmented({
              options: [
                { value: 'none', label: 'None' },
                { value: 'outline', label: 'Outline', title: 'Silhouette and sharp edges' },
                { value: 'all', label: 'All', title: 'Every facet edge' },
              ],
              get: () => fx().edges,
              set: set('edges'),
            })
          )
        )
      );
      if (f.edges !== 'none' || f.shading === 'lineart' || f.shading === 'wire') {
        extra.push(add(W.colorButton({ label: 'Line color', get: () => fx().edgeColor, set: (c, fl) => app.setFx('edgeColor', c || '#1b1c22', fl) })));
        extra.push(add(W.slider({ label: 'Line width', min: 0.2, max: 8, step: 0.1, unit: 'px', get: () => fx().edgeWidth, set: set('edgeWidth') })));
        extra.push(add(W.slider({ label: 'Crease angle', min: 5, max: 120, step: 1, unit: '°', def: 40, title: 'Only edges sharper than this get a line', get: () => fx().creaseAngle, set: set('creaseAngle') })));
      }
      extra.push(
        W.row(
          'Shadow',
          add(
            W.segmented({
              options: [
                { value: 'none', label: 'None' },
                { value: 'drop', label: 'Cast', title: 'Shadow cast onto the page by the light' },
                { value: 'floor', label: 'Floor', title: 'Soft contact shadow underneath' },
              ],
              get: () => fx().shadow,
              set: set('shadow'),
            })
          )
        )
      );
      if (f.shadow !== 'none') {
        extra.push(add(W.slider({ label: 'Opacity', min: 0, max: 100, step: 1, unit: '%', get: () => Math.round(fx().shadowOpacity * 100), set: (v, fl) => app.setFx('shadowOpacity', v / 100, fl) })));
        extra.push(add(W.slider({ label: 'Softness', min: 0, max: 40, step: 0.5, unit: 'px', get: () => fx().shadowBlur, set: set('shadowBlur') })));
        if (f.shadow === 'drop') extra.push(add(W.slider({ label: 'Distance', min: 0, max: 300, step: 1, unit: 'px', get: () => fx().shadowDist, set: set('shadowDist') })));
        extra.push(add(W.colorButton({ label: 'Shadow', get: () => fx().shadowColor, set: (c, fl) => app.setFx('shadowColor', c || '#000000', fl) })));
      }
      this.el.append(W.section('extras', 'Outlines & shadow', extra, { open: false }));

      this.el.append(
        h(
          'div.fx-actions',
          W.button({ icon: 'expand', label: 'Expand to paths', title: 'Turn the 3D result into plain editable vector shapes', onClick: () => app.expand3D() }),
          W.button({ icon: 'copy', label: 'Copy style', title: 'Copy these 3D settings', onClick: () => app.copy3D() }),
          W.button({ icon: 'sparkle', label: 'Paste style', title: 'Apply copied 3D settings to the selection', onClick: () => app.paste3D() })
        )
      );
      this.statsEl = h('p.fx-stats.muted');
      this.el.append(this.statsEl);
      this.updateStats();
    }
    updateStats() {
      if (!this.statsEl) return;
      const t = this.target();
      const c = t && Doc.cache.get(t.id);
      if (c && c.faces != null) this.statsEl.textContent = `${c.faces} vector faces · rendered in ${Math.max(1, Math.round(c.ms || 0))} ms`;
    }
    lightSection(sceneOnly, t) {
      const app = this.app;
      const kids = [];
      const usesScene = () => sceneOnly || !t || !t.fx || t.fx.useSceneLight !== false;
      const L = () => (usesScene() ? app.doc.scene.light : t.fx.light);
      const setL = (k) => (v, final) => {
        if (usesScene()) app.setSceneLight({ [k]: v }, final);
        else app.setFx('light.' + k, v, final);
      };
      if (!sceneOnly)
        kids.push(
          this.add(
            W.toggle({
              label: 'Shared scene light',
              title: 'On: every 3D object uses the same light, so the scene looks consistent',
              get: () => t.fx.useSceneLight !== false,
              set: (v) => {
                const extra = v ? {} : { light: Object.assign({}, app.doc.scene.light) };
                app.setFxMany(Object.assign({ useSceneLight: v }, extra), v ? 'Use scene light' : 'Custom light');
              },
            })
          )
        );
      const sphere = this.add(
        W.lightSphere({
          get: () => L(),
          set: (v, final) => {
            if (usesScene()) app.setSceneLight(v, final);
            else {
              app.setFx('light.az', v.az, false);
              app.setFx('light.el', v.el, final);
            }
          },
        })
      );
      const sl = (k, label, min, max, step, title, scale = 100) =>
        this.add(
          W.slider({
            label,
            min,
            max,
            step,
            unit: scale === 100 ? '%' : '',
            title,
            get: () => Math.round(L()[k] * scale * 10) / 10,
            set: (v, fl) => setL(k)(v / scale, fl),
          })
        );
      kids.push(
        h(
          'div.tb-row',
          sphere,
          h(
            'div.tb-side',
            h('p.muted.small', usesScene() ? 'Drag the sun. This light is shared by all 3D objects.' : 'Drag the sun. This light only affects the selected object.'),
            W.button({ icon: 'light', label: 'Light tool', cls: 'small ghost', title: 'Aim the light directly on the canvas (L)', onClick: () => app.setTool('light') })
          )
        )
      );
      kids.push(sl('intensity', 'Intensity', 0, 200, 1, 'Strength of the main light'));
      kids.push(sl('ambient', 'Ambient', 0, 100, 1, 'Light that reaches every side'));
      kids.push(sl('fill', 'Fill light', 0, 100, 1, 'A soft second light from the opposite side'));
      kids.push(sl('specular', 'Highlight', 0, 150, 1, 'Brightness of shiny highlights'));
      kids.push(sl('gloss', 'Gloss', 0, 100, 1, 'Smaller, sharper highlights', 1));
      return W.section(sceneOnly ? 'scenelight' : 'light', sceneOnly ? 'Scene light' : 'Light', kids);
    }
  }

  function paintPresetThumbs(root) {
    const th = W.theme();
    const col = { front: th.accent, back: th.side, side: th.side, top: th.top, edge: th.edge };
    root.querySelectorAll('.preset').forEach((b, i) => {
      const p = R3D.presets[i];
      b.firstChild.innerHTML = `<svg viewBox="0 0 30 30" width="30" height="30">${R3D.cubeMarkup(p.r[0], p.r[1], p.r[2], 30, col)}</svg>`;
    });
  }

  const thumbCache = new Map();
  function libThumb(id) {
    if (thumbCache.has(id)) return thumbCache.get(id);
    const subs = V3D.Shapes.fromLibrary(id);
    const svg = `<svg viewBox="-4 -4 108 108" width="34" height="34"><path d="${V3D.Path.toD(subs, 1)}" fill="currentColor" fill-rule="evenodd"/></svg>`;
    thumbCache.set(id, svg);
    return svg;
  }
  V3D.libThumb = libThumb;

  /* =============================== Fill & stroke =============================== */
  class PanelStyle extends Panel {
    target() {
      return this.app.primary();
    }
    style() {
      const t = this.target();
      if (!t) return this.app.style;
      if (t.type === 'group') {
        let found = null;
        Doc.walk([t], (x) => {
          if (!found && x.style && x.type !== 'group') found = x.style;
        });
        return Object.assign({}, found || Doc.defaultStyle(), { opacity: t.style.opacity == null ? 1 : t.style.opacity });
      }
      return t.style;
    }
    structureKey() {
      const t = this.target();
      const s = this.style();
      const ft = !s.fill ? 'none' : typeof s.fill === 'string' ? 'solid' : s.fill.type;
      const stops = typeof s.fill === 'object' && s.fill ? s.fill.stops.length : 0;
      return [this.app.sel.join(','), t ? t.type : '-', ft, stops, !!s.stroke, t && t.type === 'star' ? t.star : ''].join('|');
    }
    build() {
      const app = this.app;
      const t = this.target();
      const st = () => this.style();
      const add = this.add.bind(this);
      if (!t) this.el.append(h('p.note', 'Nothing selected — these settings apply to the next shapes you draw.'));
      if (t && t.type === 'image') {
        this.el.append(
          empty('image', 'Image', 'Images stay as pictures. Trace it to turn it into vector shapes you can make 3D.', W.button({ icon: 'trace', label: 'Trace bitmap…', primary: true, onClick: () => app.ui.showTrace() }))
        );
        this.el.append(W.section('opacity-img', 'Opacity', [add(W.slider({ label: 'Opacity', min: 0, max: 100, step: 1, unit: '%', get: () => Math.round((t.style.opacity == null ? 1 : t.style.opacity) * 100), set: (v, fl) => app.setStyle({ opacity: v / 100 }, fl, 'Opacity') }))]));
        return;
      }
      // Shape-specific properties first: they are what people reach for.
      if (t && t.type === 'text') this.el.append(this.textSection(t));
      if (t && ['rect', 'ellipse', 'star'].includes(t.type)) this.el.append(this.shapeSection(t));

      // Fill.
      const s = st();
      const ftype = !s.fill ? 'none' : typeof s.fill === 'string' ? 'solid' : s.fill.type;
      const fillKids = [];
      fillKids.push(
        add(
          W.segmented({
            label: 'Fill type',
            options: [
              { value: 'none', label: 'None' },
              { value: 'solid', label: 'Solid' },
              { value: 'linear', label: 'Linear' },
              { value: 'radial', label: 'Radial' },
            ],
            get: () => {
              const f = st().fill;
              return !f ? 'none' : typeof f === 'string' ? 'solid' : f.type;
            },
            set: (v) => {
              const cur = st().fill;
              const base = R3D.solidOf(cur) || '#f2a541';
              let fill;
              if (v === 'none') fill = null;
              else if (v === 'solid') fill = base;
              else {
                const stops = cur && typeof cur === 'object' ? cur.stops : [{ offset: 0, color: base }, { offset: 1, color: Color.toHex(Color.mix(Color.parse(base), { r: 20, g: 20, b: 40 }, 0.55)) }];
                fill = v === 'linear' ? { type: 'linear', x1: 0, y1: 0, x2: 1, y2: 0, stops } : { type: 'radial', cx: 0.5, cy: 0.5, r: 0.5, stops };
              }
              app.setStyle({ fill }, true, 'Fill type');
            },
          })
        )
      );
      if (ftype === 'solid') fillKids.push(add(W.colorButton({ label: 'Color', get: () => st().fill, set: (c, fl) => app.setStyle({ fill: c }, fl, 'Fill color') })));
      if (ftype === 'linear' || ftype === 'radial') fillKids.push(this.gradientEditor());
      if (t && t.type !== 'text')
        fillKids.push(
          W.row(
            'Overlaps',
            add(
              W.segmented({
                options: [
                  { value: 'nonzero', label: 'Fill all', title: 'Overlapping parts are filled (nonzero)' },
                  { value: 'evenodd', label: 'Make holes', title: 'Overlapping parts become holes (even-odd)' },
                ],
                get: () => st().fillRule || 'nonzero',
                set: (v) => app.setStyle({ fillRule: v }, true, 'Fill rule'),
              })
            )
          )
        );
      this.el.append(W.section('fill', 'Fill', fillKids));

      // Stroke.
      const strokeKids = [];
      strokeKids.push(add(W.colorButton({ label: 'Outline', allowNone: true, get: () => st().stroke, set: (c, fl) => app.setStyle({ stroke: c, strokeWidth: st().strokeWidth || 2 }, fl, 'Outline color') })));

    gradientEditor() {
      const app = this.app;

          bare: true,

        });

          g().stops.length > 2

              max: 360,

              set: (v, fl) => {
                const a = V3D.U.rad(v);

        kids.push(add(W.slider({ label: 'Height', min: 1, max: 2000, step: 1, unit: 'px', hardMin: 0.1, get: () => t.h, set: setP('h') })));
        kids.push(add(W.slider({ label: 'Corner radius', min: 0, max: Math.max(1, Math.round(Math.min(t.w, t.h) / 2)), step: 0.5, unit: 'px', hardMin: 0, def: 0, get: () => t.r || 0, set: setP('r') })));

        kids.push(add(W.slider({ label: 'Radius Y', min: 1, max: 1000, step: 1, unit: 'px', hardMin: 0.1, get: () => t.ry, set: setP('ry') })));
      } else if (t.type === 'star') {

  /* =============================== Arrange =============================== */
  class PanelArrange extends Panel {
    structureKey() {
      return [this.app.sel.length ? 'sel' : 'none', this.app.sel.length > 1 ? 'multi' : 'one'].join('|');
    }
    build() {
      const app = this.app;
      const add = this.add.bind(this);
      if (!app.sel.length) {
        this.buildDocument();
        return;
      }
      const box = () => app.selectionBBox();
      const num = (label, k, unit) =>
        add(
          W.number({
            label,
            unit,
            get: () => {
              const b = box();
              if (!b) return null;
              return { x: b.x, y: b.y, w: b.x2 - b.x, h: b.y2 - b.y }[k];
            },
            set: (v) => {
              const b = box();
              if (!b) return;
              if ((k === 'w' || k === 'h') && app.prefs.lockRatio) {
                const w = b.x2 - b.x;
                const hh = b.y2 - b.y;
                if (k === 'w') app.setSelectionBox({ w: v, h: (hh * v) / (w || 1) });
                else app.setSelectionBox({ h: v, w: (w * v) / (hh || 1) });

          })

        W.section('transform', 'Position & size', [
          h('div.xywh', num('X', 'x'), num('Y', 'y'), num('W', 'w'), num('H', 'h')),

            al('alignTop', 'top', 'Align top'),
            al('alignVCenter', 'vcenter', 'Align centers vertically'),

          h('div.btn-row', W.button({ icon: 'group', label: 'Group', cls: 'small', onClick: () => app.group() }), W.button({ icon: 'ungroup', label: 'Ungroup', cls: 'small', onClick: () => app.ungroup() })),
        ])

      this.el.append(

            op('difference', 'Subtract', () => app.boolean('difference'), 'Cut the upper shapes out of the bottom one'),
            op('intersection', 'Intersect', () => app.boolean('intersection'), 'Keep only the overlap'),
            op('exclusion', 'Exclude', () => app.boolean('exclusion'), 'Keep everything except the overlap'),
            op('combine', 'Combine', () => app.combine(), 'Join into one path, overlaps become holes (Ctrl+K)'),
            op('breakApart', 'Break apart', () => app.breakApart(), 'Split a path into separate shapes (Ctrl+Shift+K)')
          ),

      const offAmt = h('input.num', { type: 'number', value: 6, min: 0.5, step: 0.5, 'aria-label': 'Offset distance' });

            op('simplify', 'Simplify', () => app.simplify(), 'Reduce the number of nodes'),

    buildDocument() {
